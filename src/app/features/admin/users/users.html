<div class="admin-crud-container">
  <div class="crud-header">
    <h2 class="crud-title">Users</h2>
    <button class="btn-electro" (click)="openForm()">
      <i class="fas fa-plus"></i> Add User
    </button>
  </div>

  <div class="crud-body">
    <table class="table-electro">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.firstName }} {{ item.lastName }}</td>
            <td>{{ item.username }}</td>
            <td>{{ item.email }}</td>
            <td>
              <span class="badge" [class.badge-success]="item.roles?.[0]?.name === 'Admin'" [style.background-color]="item.roles?.[0]?.name === 'Admin' ? '#D10024' : '#6c757d'" style="color:white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em;">
                {{ item.roles?.[0]?.name || 'N/A' }}
              </span>
            </td>
            <td>
              <button class="btn-icon text-primary" title="Edit" (click)="openForm(item)"><i class="fas fa-edit"></i></button>
              <button class="btn-icon text-danger" title="Delete" (click)="deleteItem(item.id)"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center py-4">No users found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-popup
  [open]="isPopupOpen"
  [config]="popupConfig"
  (closed)="isPopupOpen = false"
  (confirmed)="saveItem()"
  (cancelled)="isPopupOpen = false">
  
  <div class="form-group mb-3">
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" class="form-control" placeholder="First name" [(ngModel)]="editingItem.firstName">
  </div>
  <div class="form-group mb-3">
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" class="form-control" placeholder="Last name" [(ngModel)]="editingItem.lastName">
  </div>
  <div class="form-group mb-3">
    <label for="username">Username</label>
    <input type="text" id="username" class="form-control" placeholder="Username" [(ngModel)]="editingItem.username">
  </div>
  <div class="form-group mb-3">
    <label for="email">Email</label>
    <input type="email" id="email" class="form-control" placeholder="Email address" [(ngModel)]="editingItem.email">
  </div>
  <div class="form-group mb-3">
    <label for="password">Password</label>
    <input type="password" id="password" class="form-control" placeholder="Leave blank to keep unchanged" [(ngModel)]="editingItem.password">
  </div>
  <div class="form-group mb-3">
    <label for="role">Role</label>
    <select id="role" class="form-control form-select" [(ngModel)]="selectedRoleId">
      <option value="">Select a role</option>
      @for (role of roles; track role.id) {
        <option [value]="role.id">{{ role.name }}</option>
      }
    </select>
  </div>
</app-popup>
