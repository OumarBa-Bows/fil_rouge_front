<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo mb-2">
        <a routerLink="/" style="text-decoration: none;">Electro<span class="logo__dot">.</span> <span class="admin-badge">Admin</span></a>
      </div>
      <p class="text-muted">Sign in to your account to continue</p>
    </div>
    
    <form class="login-form" (submit)="login($event)">
      <div class="form-group mb-4">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" class="form-control" placeholder="admin@electro.com" required>
        </div>
      </div>
      
      <div class="form-group mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      
      <div class="form-options mb-4">
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkmark"></span>
          Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>
      
      <button type="submit" class="btn-electro btn-block w-100">Sign In to Dashboard</button>
    </form>
  </div>
</div>
