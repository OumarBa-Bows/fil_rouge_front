<div class="admin-crud-container">
  <div class="crud-header">
    <h2 class="crud-title">Categories</h2>
    <button class="btn-electro" (click)="openForm()">
      <i class="fas fa-plus"></i> Add Category
    </button>
  </div>

  <div class="crud-body">
    <table class="table-electro">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>
              <button class="btn-icon text-primary" title="Edit" (click)="openForm(item)"><i class="fas fa-edit"></i></button>
              <button class="btn-icon text-danger" title="Delete" (click)="deleteItem(item.id)"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center py-4">No categories found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-popup
  [open]="isPopupOpen"
  [config]="popupConfig"
  (closed)="isPopupOpen = false"
  (confirmed)="saveItem()"
  (cancelled)="isPopupOpen = false">
  
  <div class="form-group mb-3">
    <label for="name">Name</label>
    <input type="text" id="name" class="form-control" placeholder="Category name" [(ngModel)]="editingItem.name">
  </div>
  <div class="form-group mb-3">
    <label for="description">Description</label>
    <textarea id="description" class="form-control" rows="3" placeholder="Category description" [(ngModel)]="editingItem.description"></textarea>
  </div>
</app-popup>
