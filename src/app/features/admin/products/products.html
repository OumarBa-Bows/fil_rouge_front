<div class="admin-crud-container">
  <div class="crud-header">
    <h2 class="crud-title">Products</h2>
    <button class="btn-electro" (click)="openForm()">
      <i class="fas fa-plus"></i> Add Product
    </button>
  </div>

  <div class="crud-body">
    <table class="table-electro">
      <thead>
        <tr>
          <th>Image</th>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.id) {
          <tr>
            <td>
              <img
                [src]="getImageUrl(item)"
                [alt]="item.name"
                style="width:48px; height:48px; object-fit:cover; border-radius:6px;"
              >
            </td>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>${{ item.price }}</td>
            <td>{{ item.stock?.quantity || 0 }}</td>
            <td><span class="badge-success">Active</span></td>
            <td>
              <button class="btn-icon text-primary" title="Edit" (click)="openForm(item)"><i class="fas fa-edit"></i></button>
              <button class="btn-icon text-danger" title="Delete" (click)="deleteItem(item.id)"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="7" class="text-center py-4">No products found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-popup
  [open]="isPopupOpen"
  [config]="popupConfig"
  (closed)="isPopupOpen = false"
  (confirmed)="saveItem()"
  (cancelled)="isPopupOpen = false">
  
  <div class="form-group mb-3">
    <label for="name">Name</label>
    <input type="text" id="name" class="form-control" placeholder="Product name" [(ngModel)]="editingItem.name">
  </div>
  <div class="form-group mb-3">
    <label for="description">Description</label>
    <textarea id="description" class="form-control" placeholder="Product description" rows="3" [(ngModel)]="editingItem.description"></textarea>
  </div>
  <div class="form-group mb-3">
    <label for="price">Price</label>
    <input type="number" id="price" class="form-control" placeholder="Product price" [(ngModel)]="editingItem.price">
  </div>
  <div class="form-group mb-3">
    <label for="category">Category</label>
    <select id="category" class="form-select form-control" [(ngModel)]="selectedCategoryId">
      <option value="">Select a category</option>
      @for (category of categories; track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  </div>
  <div class="form-group mb-3">
    <label for="stock">Stock</label>
    <input type="number" id="stock" class="form-control" placeholder="Initial stock" [(ngModel)]="stockQuantity">
  </div>
  <div class="form-group mb-3">
    <label for="image">Image Upload</label>
    <input type="file" id="image" class="form-control" accept="image/*" (change)="onFileSelected($event)">
  </div>
</app-popup>
