<!-- Main Header -->
<header class="main-header">
  <div class="main-header__container">

    <!-- Logo -->
    <div class="logo">
      <a href="/" id="logo-link">
        Electro<span class="logo__dot">.</span>
      </a>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <div class="search-bar__inner">
        <select class="search-bar__select" id="search-category">
          <option>Toutes catégories</option>
          <option>Ordinateurs</option>
          <option>Smartphones</option>
          <option>Appareils photo</option>
          <option>Accessoires</option>
        </select>
        <div class="search-bar__divider"></div>
        <input
          id="search-input"
          class="search-bar__input"
          type="text"
          placeholder="Rechercher un produit..."
        >
        <button class="search-bar__btn" id="search-btn">
          <i class="fas fa-search"></i> Rechercher
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button class="header-actions__btn" id="wishlist-btn" title="Ma liste de souhaits">
        <i class="fas fa-heart"></i>
        <span class="header-actions__badge">0</span>
        <span class="header-actions__label">Souhaits</span>
      </button>
      <button class="header-actions__btn header-actions__btn--cart" id="cart-btn" title="Mon panier">
        <i class="fas fa-shopping-cart"></i>
        <span class="header-actions__badge header-actions__badge--cart">3</span>
        <span class="header-actions__label">Panier</span>
      </button>
    </div>

  </div>
</header>
